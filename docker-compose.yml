services:
  api:
    build: .
    ports:
      - "8000:8000"
    # Адрес модели и ключ берутся из .env, который в образ не попадает.
    env_file: .env
    environment:
      # Ollama с bge-m3 работает на хосте, а не в контейнере.
      EMBED_BASE_URL: http://host.docker.internal:11434
    extra_hosts:
      - "host.docker.internal:host-gateway"
    volumes:
      - triage-data:/data
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/health')"]
      interval: 30s
      timeout: 5s
      start_period: 40s

volumes:
  triage-data:
